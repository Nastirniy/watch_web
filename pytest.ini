[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    slow: runs alembic in a subprocess
    raw_moves: the test client sends moves as written, without stating the current place (tests/conftest.py _FormClient)
    fit_types: the factories widen the type of a user whose type the test did not choose to cover the roles it gives (tests/helpers._fit_type)
filterwarnings =
    ignore::sqlalchemy.exc.SAWarning
    ignore::DeprecationWarning
