# Local check of the generator over TLS and HTTP/2 with client certificates (README.md, "Local run over HTTP/2").
# Test only: the production server block is ../../../nginx.conf (ssl_verify_client on against the client CA, CRL).
# Here nginx asks for a certificate and accepts any (optional_no_ca), so the self-signed certificates `prepare`
# writes in plain mode act as client certificates: the per-certificate limits of the events location
# ($ssl_client_fingerprint) apply as in production. The API stays in development and logs in with JSON.
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_verify_client   optional_no_ca;

    include /etc/nginx/snippets/watch-web-app.conf;
}
