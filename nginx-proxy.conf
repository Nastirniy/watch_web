# Request headers for every location that proxies to the API: `include` it in each of them.
# Install on the host as /etc/nginx/snippets/watch-web-proxy.conf.
#
# Why a file of its own: nginx copies proxy_set_header from the server level only into locations that set
# none of their own, and most API locations set some. One include per location keeps every header in every
# location; tests/test_nginx_conf.py fails on an API location without it.

proxy_set_header Connection "";                  # keepalive to the upstream (keepalive in nginx-http.conf)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The client certificate as nginx verified it (ssl_verify_client in nginx.conf). POST /auth/login trusts these
# in production, so they are always set here, never passed through: a header the client sent under one of
# these names is replaced, and left out when the variable is empty (no TLS or no certificate).
proxy_set_header X-SSL-Client-Verify      $ssl_client_verify;        # SUCCESS, FAILED:<reason> or NONE
proxy_set_header X-SSL-Client-DN          $ssl_client_s_dn;          # subject DN, RFC 2253
proxy_set_header X-SSL-Client-Serial      $ssl_client_serial;        # hex, two digits per byte
proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;   # SHA-1 of the DER certificate

# One id per request from the access log (log_format watch_web) to the API log: nginx's $request_id replaces
# whatever the client sent. The API logs it and uses it as the error_id of a 500; the response carries nginx's
# X-Request-ID (add_header in nginx-app.conf), the API's copy is hidden so there is one.
proxy_set_header X-Request-ID $request_id;
proxy_hide_header X-Request-ID;
