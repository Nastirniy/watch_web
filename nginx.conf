# Host nginx server blocks for watch_web: TLS with client certificates (mTLS) in front of the app.
#
# nginx runs on the host. The API and imgproxy run in containers on the host network
# (docker-compose.yml). Files, all required (DEPLOYMENT.md, "Host nginx"):
#   nginx-http.conf   -> /etc/nginx/conf.d/00-watch-web-http.conf    upstreams, thumbnail cache (http context)
#   nginx-app.conf    -> /etc/nginx/snippets/watch-web-app.conf      locations (server context)
#   nginx-proxy.conf  -> /etc/nginx/snippets/watch-web-proxy.conf    API proxy headers (each API location)
#   nginx.conf        -> /etc/nginx/sites-available/watch_web        this file

server {
    listen 80;
    server_name localhost;  # Replace with your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;  # Replace with your domain

    ssl_certificate     /etc/nginx/tls/server.crt;    # server certificate with its chain
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Client certificates: nginx is the control point. Every request needs a certificate issued by this CA,
    # inside its validity period and not on the CRL; anything else is refused here (400 / 495 / 496) and never
    # reaches the API. POST /auth/login then maps the verified certificate to a user (nginx-proxy.conf headers).
    ssl_client_certificate /etc/nginx/tls/client-ca.pem;   # CA certificate(s) that issue user certificates
    ssl_crl                /etc/nginx/tls/client-ca.crl;   # revocation list: refresh before its nextUpdate, then reload
    ssl_verify_client      on;
    ssl_verify_depth       2;                              # user certificate -> issuing CA -> root; raise for longer chains

    # A resumed TLS session is not verified again: a revoked certificate keeps a resumed connection at most this long
    ssl_session_cache   shared:watch_web_tls:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/watch-web-app.conf;
}
