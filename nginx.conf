# Host nginx server blocks for watch_web: TLS with client certificates (mTLS) in front of the app.
#
# nginx runs on the host. The API and imgproxy run in containers on the host network
# (docker-compose.yml). Files, all required (DEPLOYMENT.md, "Host nginx"):
#   nginx-http.conf   -> /etc/nginx/conf.d/00-watch-web-http.conf    upstreams, thumbnail cache (http context)
#   nginx-app.conf    -> /etc/nginx/snippets/watch-web-app.conf      locations (server context)
#   nginx-proxy.conf  -> /etc/nginx/snippets/watch-web-proxy.conf    API proxy headers (each API location)
#   nginx.conf        -> /etc/nginx/sites-available/watch_web        this file

server {
    listen 80;
    server_name localhost;  # Replace with your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # HTTP/2: a browser holds 6 HTTP/1.1 connections per server, and a stream of events holds one for good: at 6
    # tabs every request of the app would hang (measured in Chromium). Asked for at the handshake, so it works with
    # ssl_verify_client. It acts on every route of this server (uploads and video included: DEPLOYMENT.md)
    http2 on;
    server_name localhost;  # Replace with your domain

    # Server certificate: Let's Encrypt (certbot renews it and reloads nginx).
    ssl_certificate     /etc/letsencrypt/live/watch.example.org/fullchain.pem;   # edit: your domain
    ssl_certificate_key /etc/letsencrypt/live/watch.example.org/privkey.pem;     # edit: your domain
    ssl_protocols TLSv1.2 TLSv1.3;

    # Client certificates: nginx is the control point. Every request needs a certificate issued by one of the CAs
    # in the bundle, inside its validity period and not on the CRL; anything else is refused here (400 / 495 / 496)
    # and never reaches the API. POST /auth/login then maps the verified certificate to a user (nginx-proxy.conf
    # headers). The folder is PKI_DIR of .env (PKI.md, "nginx"); /srv/watch_web/pki is an example.
    ssl_client_certificate /srv/watch_web/pki/ca/nginx-client-cas.pem;   # edit: PKI_DIR; client CA + existing root while old certificates live
    ssl_crl                /srv/watch_web/pki/crl/nginx.crl;             # edit: PKI_DIR; published by the API; every CA above needs its CRL in it
    ssl_verify_client      on;
    ssl_verify_depth       1;                                            # user certificate -> its CA (no intermediates)

    # The CRL is re-read only on reload: deploy/systemd/watch-web-crl.path reloads nginx whenever the API publishes it.

    # A resumed TLS session is not verified again: a revoked certificate keeps a resumed connection at most this long
    ssl_session_cache   shared:watch_web_tls:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/watch-web-app.conf;

    # The web client, from the same origin as the API, so the browser needs no CORS. Where its build lives is
    # deployment configuration: point root at it (index.html and its assets). Without one, "/" answers 404.
    location / {
        root /var/www/watch_web_client;
        try_files $uri $uri/ /index.html =404;   # client-side routes load index.html; no build: 404
    }
}
