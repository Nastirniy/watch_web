# http-level directives for the watch_web media pipeline.
# Install on the host nginx as /etc/nginx/conf.d/00-watch-web-http.conf (the http {} context).
# nginx runs on the host; the API and imgproxy run in containers on the host network.

# imgproxy renders thumbnails and previews on demand; nginx caches every rendered image here.
# One render serves every user. levels=1:2 keeps directories small, inactive=30d evicts what
# nobody asked for in a month, max_size caps disk use (20 GB holds roughly half a million
# 300 px WebP thumbnails). use_temp_path=off writes straight into the cache directory.
# The directory must exist and be writable by the nginx worker user.
proxy_cache_path /var/cache/nginx/thumbs levels=1:2 keys_zone=thumbs:64m max_size=20g inactive=30d use_temp_path=off;

# GET /api/v1/media/{id}/stream: the API's answer to "may this token and certificate stream this video" (its
# X-Accel-Redirect and headers), kept 30 s by the location /_stream_auth in nginx-app.conf. One small entry per
# token and video; inactive=2m drops entries nobody uses. docs/superpowers/specs/2026-10-19-stream-auth-cache-design.md
proxy_cache_path /var/cache/nginx/stream_auth levels=1:2 keys_zone=stream_auth:10m max_size=100m inactive=2m use_temp_path=off;

# The file of an allowed stream: the path after /protected_uploads in the API's X-Accel-Redirect. Anything else
# (empty, another prefix) maps to "" and the stream location hands the request to the API.
map $stream_accel $stream_file {
    ~^/protected_uploads(?<stream_rest>/.+)$ $stream_rest;
    default "";
}

# An idle upstream connection is closed by nginx before the server behind it closes it: otherwise a request sent on a
# connection the server is closing at that moment fails (recv() reset, 502; nginx does not resend a POST). uvicorn
# closes after 5 s (--timeout-keep-alive), imgproxy after 10 s (IMGPROXY_KEEP_ALIVE_TIMEOUT); nginx's default is 60 s.
# Seen on the test server 2026-11-22: one 502 on POST /observations/create under load. tests/infra/test_nginx_conf.py
upstream imgproxy {
    server 127.0.0.1:8080;         # IMGPROXY_PORT in .env
    keepalive 16;
    keepalive_timeout 8s;          # below imgproxy's 10 s
}

upstream watch_web_api {
    server 127.0.0.1:8000;         # API_PORT in .env
    keepalive 16;
    keepalive_timeout 4s;          # below uvicorn's 5 s
}

# The stream of events has an upstream of its own: moving streams to another process is this one line. No keepalive:
# a stream holds its upstream connection for its whole life.
upstream watch_web_events {
    server 127.0.0.1:8000;         # API_PORT in .env
}

# Requests with an empty key are not counted: the plain e2e stack has no certificate, so only the overall limit acts
# there. A zone's key cannot change on a reload: nginx keeps the old configuration and says so only in its error log
# (restart nginx after changing a key).
limit_conn_zone $ssl_client_fingerprint zone=events_per_certificate:10m;
limit_req_zone  $ssl_client_fingerprint zone=events_connects_per_certificate:10m rate=2r/s;
limit_req_zone  "all"                   zone=events_connects:1m rate=40r/s;

# Access log of watch_web (access_log in nginx-app.conf): the combined format plus the request id, which the API
# answers in X-Request-ID and logs too, and what the upstream answered
log_format watch_web '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" request_id=$request_id '
                     'upstream_status=$upstream_status request_time=$request_time';
