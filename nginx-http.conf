# http-level directives for the watch_web media pipeline.
# Install on the host nginx as /etc/nginx/conf.d/00-watch-web-http.conf (the http {} context).
# nginx runs on the host; the API and imgproxy run in containers on the host network.

# imgproxy renders thumbnails and previews on demand; nginx caches every rendered image here.
# One render serves every user. levels=1:2 keeps directories small, inactive=30d evicts what
# nobody asked for in a month, max_size caps disk use (20 GB holds roughly half a million
# 300 px WebP thumbnails). use_temp_path=off writes straight into the cache directory.
# The directory must exist and be writable by the nginx worker user.
proxy_cache_path /var/cache/nginx/thumbs levels=1:2 keys_zone=thumbs:64m max_size=20g inactive=30d use_temp_path=off;

upstream imgproxy {
    server 127.0.0.1:8080;         # IMGPROXY_PORT in .env
    keepalive 16;
}

upstream watch_web_api {
    server 127.0.0.1:8000;         # API_PORT in .env
    keepalive 16;
}

# Access log of watch_web (access_log in nginx-app.conf): the combined format plus the request id, which the API
# answers in X-Request-ID and logs too, and what the upstream answered
log_format watch_web '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" request_id=$request_id '
                     'upstream_status=$upstream_status request_time=$request_time';
