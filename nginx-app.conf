# watch_web server body: everything inside the server block except listen, TLS and "/".
# Install on the host as /etc/nginx/snippets/watch-web-app.conf. It is included by nginx.conf (production:
# TLS with client certificates) and by tests/docker/nginx-server.test.conf (the plain http e2e stack), so
# both run the same locations. Every location that proxies to the API includes watch-web-proxy.conf.
# The locations claim only the paths the API publishes; "/" belongs to the server block, where the web client
# is deployment configuration (nginx.conf). tests/infra/test_nginx_conf.py checks that every API route is covered.
#
# IMPORTANT: Adjust paths according to your deployment
# - /var/www/radio_monitoring/uploads   MEDIA_ROOT in .env (the media directory, local or mounted share);
#                                       the containers see it under the same path
# - /var/www/nginx_uploads              NGINX_UPLOAD_TEMP in .env (shared with the API container)
# - /protected_uploads/                 settings.storage.nginx_internal_uploads_prefix
# - /_thumb/                            settings.storage.imgproxy.nginx_internal_prefix
# - /media-images/                      settings.storage.imgproxy.public_prefix

# Safety net above settings.storage.max_file_size_gb (10 GB), never equal to it: the API checks the size itself and
# answers media_file_too_large with the limit; at an equal limit nginx answered its own HTML 413 first
client_max_body_size 11G;

# Proxy timeouts for long-running requests (large uploads/downloads)
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

proxy_http_version 1.1;

# Every response carries the id of its request, nginx's own error pages included (always), and the access log
# records it: the id a user quotes finds the request here and in the API log (request_id.py). A location with
# add_header of its own inherits none of these, so it repeats the line (tests/infra/test_nginx_conf.py).
add_header X-Request-ID $request_id always;
access_log /var/log/nginx/watch_web.access.log watch_web;

# =========================================================================
# UPLOAD OFFLOADING (client_body_in_file_only)
# =========================================================================
# Nginx writes the raw request body to a temp file on disk, then passes the
# temp file path to the API in X-File-Name. The API never loads the file.
# `clean`: nginx deletes the file when the request ends (after a store the API
# has moved it), so a body refused before the handler runs (401, 422, API down)
# never stays on disk. The API's answer is awaited even when the client leaves
# (proxy_ignore_client_abort): the file is never deleted under a running store.
#
# Client usage:
#   POST /api/v1/media/nginx-upload?observation_id=1&media_type=video
#   Headers: Authorization: Bearer <token>, X-Original-Filename: my_video.mp4
#   Body: raw binary file data
# =========================================================================
location /api/v1/media/nginx-upload {
    include /etc/nginx/snippets/watch-web-proxy.conf;

    client_body_in_file_only clean;
    proxy_ignore_client_abort on;
    client_body_temp_path /var/www/nginx_uploads 1 2;   # NGINX_UPLOAD_TEMP; the API container mounts the same path
    client_body_buffer_size 16k;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-File-Name $request_body_file;
    proxy_set_header X-Original-Filename $http_x_original_filename;
    proxy_set_header Authorization $http_authorization;

    proxy_pass http://watch_web_api;
}

# =========================================================================
# RESUMABLE UPLOADS (chunks streamed to the API, not buffered by nginx)
# =========================================================================
# PATCH /api/v1/media/uploads/{id} bodies are at most storage.upload.max_chunk_bytes
# (64 MB by default). Streaming them avoids a second copy on disk and lets the API
# record the offset as soon as the bytes are written.
# =========================================================================
location ^~ /api/v1/media/uploads {
    include /etc/nginx/snippets/watch-web-proxy.conf;

    client_max_body_size 65m;              # above storage.upload.max_chunk_bytes (64 MB): the API answers upload_chunk_too_large
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://watch_web_api;
}

# =========================================================================
# APPLICATION (FastAPI): every top-level path the API publishes
# =========================================================================
# APIVersionRoutes (/api/v1, later /api/v2; each with its OpenAPI document and viewers, DocsRoutes)
# and SystemRoutes. A new top-level path in the API needs its location here, a location without a route
# goes (tests/infra/test_nginx_conf.py). No WebSocket routes, no Upgrade handling.
# =========================================================================
# =========================================================================
# EVENTS: GET /api/v1/events/stream, one long response per browser tab
# =========================================================================
# Not buffered: a block reaches the client when the API writes it. proxy_read_timeout outlasts three heartbeats, so a
# dead API is noticed. send_timeout closes a client that stopped reading; the API's queue is bounded by itself.
# Connects are delayed, never refused, at 40/s overall: a deploy brings every client back at once and each connect is
# a full API request (measured: 180/s took normal p95 to 134 ms, 40/s to 89 ms). A client may wait over a minute.
# 32 streams per client certificate (one certificate may sit on several computers), 2 connects/s per certificate
# (a client looping on connect). 429 from here is the infrastructure's: handled by status (API.md, "Errors").
# No add_header here: X-Request-ID is inherited from the server level.
location = /api/v1/events/stream {
    include /etc/nginx/snippets/watch-web-proxy.conf;
    proxy_pass http://watch_web_events;

    limit_conn events_per_certificate 32;
    limit_conn_status 429;
    limit_req zone=events_connects_per_certificate burst=20 nodelay;
    limit_req zone=events_connects burst=3000;
    limit_req_status 429;

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;
    proxy_send_timeout 30s;
    send_timeout 30s;
}

location /api/ {
    include /etc/nginx/snippets/watch-web-proxy.conf;
    proxy_pass http://watch_web_api;
}

location /problems {                 # the "type" URI of every error: /problems and /problems/{code}
    include /etc/nginx/snippets/watch-web-proxy.conf;
    proxy_pass http://watch_web_api;
}

location = /health {
    include /etc/nginx/snippets/watch-web-proxy.conf;
    proxy_pass http://watch_web_api;
}

# =========================================================================
# ORIGINAL FILES: download and stream (X-Accel-Redirect)
# =========================================================================
# The API authorises, then answers with
#   X-Accel-Redirect: /protected_uploads/2026/09/02/obs_017/91_abc.mp4
# and nginx serves the file with sendfile and Range support.
#
# Every header reaches the client once. Checked live in nginx:1.27.5 (2026-10-29, a stub API answering
# X-Accel-Redirect): of the API's answer nginx passes on only Content-Type, Content-Disposition, Cache-Control,
# Expires, Accept-Ranges and Set-Cookie and drops every other header (nosniff and the CSP sent by the API never
# arrived; ETag and X-File-Hash neither). With an add_header here as well, Cache-Control arrived twice and
# Accept-Ranges three times (the static module sends its own). So nginx owns the headers below and the API leaves
# Cache-Control, Accept-Ranges, nosniff and the CSP out of its X-Accel answer (services/files/serve.py accel_headers);
# tests/media/test_file_serve.py and tests/infra/test_nginx_conf.py hold both sides.
# The file's identity is the API's: its ETag (the sha256), Repr-Digest and X-File-Hash stay in the X-Accel answer and
# are copied from it here with $upstream_http_*; nginx's own ETag (mtime-size) is off. An upstream header that is
# absent gives an empty value, and add_header with an empty value sends nothing (a file without a hash). If-Range
# compares with that ETag (a match 206, a mismatch 200). If-None-Match cannot be answered here: nginx's not_modified
# filter runs before add_header and never sees the ETag, so the API answers it before it hands the file over
# (a match is its 304, no X-Accel-Redirect; api/shared/helpers/media_helper.py stored_file_response). Checked live
# in nginx:1.27 (2026-10-30).
# nosniff and the CSP without "always": a 200, a 206 and nginx's own 416 (a Range past the end) carry each once;
# with "always" the 416 carried both twice (as it does X-Served-By and X-Request-ID), and the only answer that then
# gained them is nginx's own 404 page, which holds no byte of a stored file.
# So nginx's own error pages here (403, 404) carry neither nosniff nor the CSP: they are nginx's fixed HTML with no
# stored content. Its 416 is the exception, it keeps both once (built on the headers of the file answer).
# The CSP: a file opened as a page runs sandboxed with nothing allowed to load; <video>/<img> loads are not
# documents, CSP does not apply to them.
# =========================================================================
location ^~ /protected_uploads/ {
    internal;
    alias /var/www/radio_monitoring/uploads/;   # MEDIA_ROOT with a trailing slash

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    sendfile_max_chunk 1m;
    etag off;

    add_header ETag $upstream_http_etag;
    add_header Repr-Digest $upstream_http_repr_digest;
    add_header X-File-Hash $upstream_http_x_file_hash;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "sandbox; default-src 'none'";
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Served-By nginx always;
    add_header X-Request-ID $request_id always;
}

# =========================================================================
# STREAM: the API authorises once per 30 s, nginx serves every Range request
# =========================================================================
# GET /api/v1/media/{id}/stream (players seek with many Range requests):
#   auth_request /_stream_auth  -> cached 30 s per token, client certificate and URI; on a miss the request
#                                  goes to the API's stream route, which answers 200 + X-Accel-Redirect
#   allowed                     -> nginx serves the file of that X-Accel-Redirect with the API's headers
#   refused (401, 403, or any other answer, a 404 included) -> @stream_api: the request goes to the API as
#                                  sent, which answers its problem (never a body of nginx's own)
# Access taken away (logout, revoked session or certificate, permission, archive) stops a stream within about 30 s
# (whole seconds: 30 to 31 s after the answer was cached).
# A request with If-None-Match skips all this and goes straight to the API (the rewrite phase runs before
# auth_request): only the API can answer it (see ORIGINAL FILES above), with its own access checks; when the file is
# served after all, its X-Accel-Redirect ends in /protected_uploads/, a normal Range request included.
# /download stays on the plain path below (/api/ + X-Accel-Redirect): one request per file, nothing to save.
# docs/superpowers/specs/2026-10-19-stream-auth-cache-design.md
# =========================================================================
location ~ ^/api/v1/media/\d+/stream$ {
    if ($http_if_none_match) {
        return 418;                             # never answered: error_page below hands it to the API
    }
    auth_request /_stream_auth;
    auth_request_set $stream_accel $upstream_http_x_accel_redirect;
    auth_request_set $stream_type $upstream_http_content_type;
    auth_request_set $stream_disposition $upstream_http_content_disposition;
    auth_request_set $stream_hash $upstream_http_x_file_hash;
    auth_request_set $stream_etag $upstream_http_etag;
    auth_request_set $stream_digest $upstream_http_repr_digest;
    error_page 401 403 418 500 = @stream_api;

    root /var/www/radio_monitoring/uploads;     # MEDIA_ROOT, the directory of the /protected_uploads/ alias
    try_files $stream_file @stream_api;         # $stream_file: map in nginx-http.conf; a missing file -> the API

    # The API's Content-Type (the stored type, not the extension's): no type of nginx's own
    types { }
    default_type "";
    etag off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    sendfile_max_chunk 1m;

    add_header Content-Type $stream_type;
    add_header Content-Disposition $stream_disposition;
    add_header ETag $stream_etag;                  # the API's, as /protected_uploads/ (empty: no header)
    add_header Repr-Digest $stream_digest;
    add_header X-File-Hash $stream_hash;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff;     # as /protected_uploads/ (no "always" there either, see there)
    add_header Content-Security-Policy "sandbox; default-src 'none'";
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Request-ID $request_id always;
}

location = /_stream_auth {
    internal;
    include /etc/nginx/snippets/watch-web-proxy.conf;
    proxy_pass http://watch_web_api$request_uri;   # the stream route itself, with its checks

    # The answer does not depend on the body, the range or a cached copy of the client
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Range "";
    proxy_set_header If-None-Match "";
    proxy_set_header If-Range "";

    # Keep X-Accel-Redirect as data (not followed), cache despite the API's Cache-Control: private
    proxy_ignore_headers X-Accel-Redirect Cache-Control Expires Set-Cookie;

    # auth_request copies the WWW-Authenticate of a 401 from the upstream answer (proxy_hide_header does not reach
    # it) and @stream_api then adds the API's own: two challenges. For auth_request a 401 is a plain 403; the
    # stream request goes to @stream_api all the same and the client gets the API's 401 with one challenge.
    proxy_intercept_errors on;
    error_page 401 = @stream_auth_refused;

    proxy_cache stream_auth;
    proxy_cache_key "$http_authorization|$ssl_client_fingerprint|$request_uri";
    proxy_cache_valid 200 30s;            # nothing else is cached: a refusal is asked again every time
    proxy_cache_lock on;                  # players starting one video at once: one request to the API
}

location @stream_auth_refused {
    return 403;
}

location @stream_api {
    include /etc/nginx/snippets/watch-web-proxy.conf;
    proxy_pass http://watch_web_api;
}

# =========================================================================
# THUMBNAILS, internal (X-Accel-Redirect to imgproxy through the cache)
# =========================================================================
# GET /api/v1/media/{id}/thumbnail: the API authorises and answers with
#   X-Accel-Redirect: /_thumb/{signature}/rs:fit:300:300:0:0/q:85/{source}
# nginx serves the cached render, or asks imgproxy once and stores the result.
# proxy_cache_lock collapses concurrent misses for the same key into one render.
# =========================================================================
location ^~ /_thumb/ {
    internal;
    proxy_pass http://imgproxy/;      # trailing slash strips the /_thumb/ prefix

    proxy_cache thumbs;
    proxy_cache_key $uri;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;   # no exp: here, the 30 days above apply
    proxy_hide_header Cache-Control;                          # one Cache-Control: the one below

    proxy_set_header Connection "";   # keepalive to imgproxy
    proxy_set_header Host $host;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control "private, max-age=86400";
    add_header X-Content-Type-Options nosniff;
    add_header X-Request-ID $request_id always;
}

# =========================================================================
# MEDIA IMAGES, public signed URLs (list responses and share links)
# =========================================================================
# Every image made from a media file that a browser loads without a token:
# thumbnails and previews (imgproxy renders them from the original or the poster) and
# the storyboard sheets of the seek previews (sprite JPEGs listed in the WebVTT of the API).
# URLs carry an imgproxy signature and an exp: option, so imgproxy itself
# rejects tampered or expired links. No API round trip, plain <img src>.
# "Public" means no token: behind nginx.conf the client certificate is still required.
# Only imgproxy checks exp:, on a cache miss. It caps the max-age of its answer at
# exp:, so the cache keeps a render only that long (Cache-Control is not ignored,
# no fixed lifetime for 200, no stale copies): an expired link answers imgproxy's 404.
# =========================================================================
location ^~ /media-images/ {
    proxy_pass http://imgproxy/;

    proxy_cache thumbs;
    proxy_cache_key $uri;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_ignore_headers Expires Set-Cookie;
    proxy_hide_header Cache-Control;                          # one Cache-Control: the one below

    proxy_set_header Connection "";   # keepalive to imgproxy
    proxy_set_header Host $host;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff;
    add_header X-Request-ID $request_id always;
}

# No error_page: nginx's own errors keep their status (502 API not reachable, 504 too slow), which is all a client
# reads from them (API.md, "Errors"). A page that is not there turned every 502 into a 404 on the Ubuntu package.
