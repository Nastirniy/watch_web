# watch_web server body: everything inside the server block except listen and TLS.
# Install on the host as /etc/nginx/snippets/watch-web-app.conf. It is included by nginx.conf (production:
# TLS with client certificates) and by tests/docker/nginx-server.test.conf (the plain http e2e stack), so
# both run the same locations. Every location that proxies to the API includes watch-web-proxy.conf.
#
# IMPORTANT: Adjust paths according to your deployment
# - /var/www/radio_monitoring/uploads   MEDIA_ROOT in .env (the media directory, local or mounted share);
#                                       the containers see it under the same path
# - /var/www/nginx_uploads              NGINX_UPLOAD_TEMP in .env (shared with the API container)
# - /protected_uploads/                 settings.storage.nginx_internal_uploads_prefix
# - /_thumb/                            settings.storage.imgproxy.nginx_internal_prefix
# - /t/                                 settings.storage.imgproxy.public_prefix

# Maximum upload file size -- must match settings.storage.max_file_size_gb
client_max_body_size 10G;

# Proxy timeouts for long-running requests (large uploads/downloads)
proxy_connect_timeout 600s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

proxy_http_version 1.1;

# =========================================================================
# UPLOAD OFFLOADING (client_body_in_file_only)
# =========================================================================
# Nginx writes the raw request body to a temp file on disk, then passes the
# temp file path to the API in X-File-Name. The API never loads the file.
#
# Client usage:
#   POST /api/v1/media/nginx-upload?observation_id=1&media_type=video
#   Headers: Authorization: Bearer <token>, X-Original-Filename: my_video.mp4
#   Body: raw binary file data
# =========================================================================
location /api/v1/media/nginx-upload {
    include /etc/nginx/snippets/watch-web-proxy.conf;

    client_body_in_file_only on;
    client_body_temp_path /var/www/nginx_uploads 1 2;   # NGINX_UPLOAD_TEMP; the API container mounts the same path
    client_body_buffer_size 16k;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-File-Name $request_body_file;
    proxy_set_header X-Original-Filename $http_x_original_filename;
    proxy_set_header Authorization $http_authorization;

    proxy_pass http://watch_web_api;
}

# =========================================================================
# RESUMABLE UPLOADS (chunks streamed to the API, not buffered by nginx)
# =========================================================================
# PATCH /api/v1/media/uploads/{id} bodies are at most storage.upload.max_chunk_bytes
# (64 MB by default). Streaming them avoids a second copy on disk and lets the API
# record the offset as soon as the bytes are written.
# =========================================================================
location ^~ /api/v1/media/uploads {
    include /etc/nginx/snippets/watch-web-proxy.conf;

    client_max_body_size 64m;              # must be >= storage.upload.max_chunk_bytes
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://watch_web_api;
}

# =========================================================================
# DEFAULT PROXY (FastAPI application)
# =========================================================================
# The API has no WebSocket routes, so no Upgrade handling here.
# =========================================================================
location / {
    include /etc/nginx/snippets/watch-web-proxy.conf;
    proxy_pass http://watch_web_api;
}

# =========================================================================
# ORIGINAL FILES: download and stream (X-Accel-Redirect)
# =========================================================================
# The API authorises, then answers with
#   X-Accel-Redirect: /protected_uploads/2026/09/02/obs_017/91_abc.mp4
# and nginx serves the file with sendfile and Range support.
# =========================================================================
location ^~ /protected_uploads/ {
    internal;
    alias /var/www/radio_monitoring/uploads/;   # MEDIA_ROOT with a trailing slash

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    sendfile_max_chunk 1m;

    add_header Accept-Ranges bytes;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Served-By nginx always;
}

# =========================================================================
# THUMBNAILS, internal (X-Accel-Redirect to imgproxy through the cache)
# =========================================================================
# GET /api/v1/media/{id}/thumbnail: the API authorises and answers with
#   X-Accel-Redirect: /_thumb/{signature}/rs:fit:300:300:0:0/q:85/{source}
# nginx serves the cached render, or asks imgproxy once and stores the result.
# proxy_cache_lock collapses concurrent misses for the same key into one render.
# =========================================================================
location ^~ /_thumb/ {
    internal;
    proxy_pass http://imgproxy/;      # trailing slash strips the /_thumb/ prefix

    proxy_cache thumbs;
    proxy_cache_key $uri;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    proxy_set_header Connection "";   # keepalive to imgproxy
    proxy_set_header Host $host;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control "private, max-age=86400";
    add_header X-Content-Type-Options nosniff;
}

# =========================================================================
# THUMBNAILS, public signed URLs (list responses and share links)
# =========================================================================
# URLs carry an imgproxy signature and an exp: option, so imgproxy itself
# rejects tampered or expired links. No API round trip, plain <img src>.
# "Public" means no token: behind nginx.conf the client certificate is still required.
# =========================================================================
location ^~ /t/ {
    proxy_pass http://imgproxy/;

    proxy_cache thumbs;
    proxy_cache_key $uri;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;

    proxy_set_header Connection "";   # keepalive to imgproxy
    proxy_set_header Host $host;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control "private, max-age=3600";
    add_header X-Content-Type-Options nosniff;
}

# Error pages
error_page 500 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
}
