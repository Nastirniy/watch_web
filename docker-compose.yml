# Radio Monitoring System: application services only.
#
# Topology (see DEPLOYMENT.md):
#   host nginx  -> 127.0.0.1:8000 (api container)     entry point, TLS, upload offload, media and thumbnail cache
#               -> 127.0.0.1:8080 (imgproxy container) through the internal /_thumb/ and public /media-images/ locations
#   host MySQL  <- api and media-worker on 127.0.0.1:3306
#   MEDIA_ROOT  <- host directory (local disk or a mounted NFS/SMB share), bind-mounted at the SAME path
#                  into every container, so nginx, the API, the worker and imgproxy agree on one path.
#
# Containers use the host network: no port mapping, the database and nginx are reached on 127.0.0.1,
# and nothing has to be reconfigured on the host. See the "bridge network" note at the bottom for
# Docker Desktop or hosts where host networking is not wanted.
#
#   cp .env.example .env            # database, secret key, imgproxy key/salt, MEDIA_ROOT, MEDIA_UID/GID
#   deploy/release.sh build         # on a machine with the source and internet: builds watch-web:<tag>
#   deploy/release.sh deploy <tag>  # on the server: backup, migrate, WATCH_WEB_TAG in .env, up -d (RELEASE.md)
#
# Releases (RELEASE.md): every watch-web service runs the ONE image watch-web:${WATCH_WEB_TAG}, a tag
# <YYYY.MM.DD>-<sha7> per commit. Compose never builds or pulls it (pull_policy: never, no build:): an image is made
# by deploy/release.sh build and brought to the server with docker load. imgproxy is pinned in .env (IMGPROXY_IMAGE,
# IMGPROXY_IMAGE_ID, checked by release.sh).
#
# PKI client certificates (signer container, API mounts): docker-compose.pki.yml, enabled through COMPOSE_FILE in
# .env (see .env.example and PKI.md). Without it this file runs as it is.
# Database backups (db-backup tool service, read-only mounts on the API): docker-compose.backup.yml and, for an
# off-host copy, docker-compose.backup-copy.yml, also through COMPOSE_FILE (BACKUPS.md).
#
# Air-gapped servers: `deploy/release.sh save <tag> images.tgz` on the build machine, `deploy/release.sh load
# images.tgz` on the server (RELEASE.md, "Move images to an air-gapped server").

x-app: &app
  image: watch-web:${WATCH_WEB_TAG:?set WATCH_WEB_TAG in .env (see RELEASE.md)}
  pull_policy: never
  env_file: .env
  network_mode: host
  # Run as the owner of MEDIA_ROOT so files written by the containers stay readable by host nginx
  user: "${MEDIA_UID:-10001}:${MEDIA_GID:-10001}"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  api:
    <<: *app
    environment:
      MYSETTINGS_SERVER__HOST: 127.0.0.1          # only host nginx talks to the API
      MYSETTINGS_SERVER__PORT: ${API_PORT:-8000}
      MYSETTINGS_STORAGE__UPLOAD_PATH: ${MEDIA_ROOT:?set MEDIA_ROOT in .env}
      MYSETTINGS_STORAGE__TEMP_PATH: ${MEDIA_ROOT}/_tmp
      MYSETTINGS_STORAGE__ENABLE_NGINX: "true"
      MYSETTINGS_STORAGE__NGINX_UPLOAD_TEMP_PATH: ${NGINX_UPLOAD_TEMP:?set NGINX_UPLOAD_TEMP in .env}
      MYSETTINGS_STORAGE__IMGPROXY__URL: http://127.0.0.1:${IMGPROXY_PORT:-8080}
      # No pre-warming: nginx.conf serves nothing without a client certificate (port 80 only redirects), so the
      # API has no way into the thumbnail cache; the first viewer of a thumbnail waits for one render instead
      MYSETTINGS_STORAGE__THUMBNAIL__PREWARM: "false"
      # imgproxy's limit: larger images are stored with thumbnail_status unsupported (same variable as imgproxy below)
      MYSETTINGS_STORAGE__IMGPROXY__MAX_SRC_RESOLUTION_MP: ${IMGPROXY_MAX_SRC_RESOLUTION:-250}
      # Real-time events (API.md): the same value on api and media-worker (the worker removes old rows)
      MYSETTINGS_EVENTS__ENABLED: ${EVENTS_ENABLED:-false}
    volumes:
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
      - ${NGINX_UPLOAD_TEMP}:${NGINX_UPLOAD_TEMP}
    healthcheck:
      # /health/ready (database reachable, schema in range); an image from before it answers 404 there and is
      # checked on /health instead, so a rollback to it is not reported unhealthy (RELEASE.md)
      test: ["CMD", "python", "-c", "import sys,urllib.request,urllib.error\nbase='http://127.0.0.1:${API_PORT:-8000}'\ndef get(path):\n    try:\n        return urllib.request.urlopen(base + path, timeout=5).status\n    except urllib.error.HTTPError as e:\n        return e.code\nstatus = get('/health/ready')\nif status == 404:\n    status = get('/health')\nsys.exit(0 if status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The start migrates before the API listens (migration 031: about 3.5 minutes per million audit rows), and a
      # failed check inside start_period does not count: unhealthy earlier would make `docker compose up` refuse the
      # media-worker (depends_on service_healthy). The first passing check ends the start period, so a normal start
      # is healthy as soon as it listens (DEPLOYMENT.md, "Audit log (migration 031)").
      start_period: 20m
    # Above the 25 s of --timeout-graceful-shutdown (Dockerfile): open requests end before Docker kills the process
    stop_grace_period: 30s
    # Every open connection is a file descriptor, and a container's soft limit may be 1024
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  media-worker:
    <<: *app
    command: ["python", "-m", "app.backend.workers.media_worker"]
    depends_on:
      # the API migrates the database at its start: on a fresh one the worker found no media_files table
      api:
        condition: service_healthy
    environment:
      MYSETTINGS_STORAGE__UPLOAD_PATH: ${MEDIA_ROOT:?set MEDIA_ROOT in .env}
      MYSETTINGS_STORAGE__TEMP_PATH: ${MEDIA_ROOT}/_tmp
      MYSETTINGS_EVENTS__ENABLED: ${EVENTS_ENABLED:-false}
    volumes:
      - ${MEDIA_ROOT}:${MEDIA_ROOT}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1g}
    healthcheck:
      # The alive file the worker touches after every heartbeat (workers/alive.py: younger than 3 heartbeats). Run
      # only where the image has that module: an older image (a rollback) passes, and its media_worker is never run
      # a second time by a check
      test: ["CMD", "python", "-c", "import importlib.util,runpy,sys\nif importlib.util.find_spec('app.backend.workers.alive') is None:\n    sys.exit(0)\nrunpy.run_module('app.backend.workers.alive', run_name='__main__')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    stop_grace_period: 90s

  # One-off: migrate the database with the release in WATCH_WEB_TAG, under the api's schema lock, then exit.
  # deploy/release.sh deploy runs it with the NEW tag while the old services keep serving (RELEASE.md):
  #   WATCH_WEB_TAG=<tag> docker compose run --rm -T migrate
  # The api still migrates at its start too; both take the same lock, so they never run alembic at once.
  migrate:
    image: watch-web:${WATCH_WEB_TAG:?set WATCH_WEB_TAG in .env (see RELEASE.md)}
    pull_policy: never
    profiles: ["tools"]
    env_file: .env
    network_mode: host
    user: "${MEDIA_UID:-10001}:${MEDIA_GID:-10001}"
    entrypoint: ["python", "-m", "app.backend.cli.migrations_manager", "migrate"]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  imgproxy:
    # Pinned in .env: the exact version tag (ghcr.io/imgproxy/imgproxy:v3.31.4), with @sha256:<digest> where the
    # server's image store resolves it after docker load; release.sh compares the image id with IMGPROXY_IMAGE_ID
    image: ${IMGPROXY_IMAGE:?set IMGPROXY_IMAGE in .env (see RELEASE.md)}
    network_mode: host
    user: "${MEDIA_UID:-10001}:${MEDIA_GID:-10001}"
    environment:
      IMGPROXY_BIND: "127.0.0.1:${IMGPROXY_PORT:-8080}"
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY in .env (hex)}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT in .env (hex)}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: ${MEDIA_ROOT}
      IMGPROXY_MAX_SRC_RESOLUTION: ${IMGPROXY_MAX_SRC_RESOLUTION:-250}   # megapixels; the API reads the same value
      IMGPROXY_MAX_SRC_FILE_SIZE: "209715200"
      IMGPROXY_TIMEOUT: "10"
      IMGPROXY_READ_REQUEST_TIMEOUT: "10"
      IMGPROXY_AUTO_ROTATE: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_TTL: "86400"
      IMGPROXY_PROMETHEUS_BIND: "127.0.0.1:${IMGPROXY_METRICS_PORT:-8081}"
      IMGPROXY_LOG_FORMAT: structured
    volumes:
      - ${MEDIA_ROOT}:${MEDIA_ROOT}:ro
    deploy:
      resources:
        limits:
          memory: ${IMGPROXY_MEMORY_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

# ---------------------------------------------------------------------------
# Bridge network variant (Docker Desktop, or when host networking is not allowed)
# ---------------------------------------------------------------------------
# Replace `network_mode: host` on every service with:
#   ports: ["127.0.0.1:8000:8000"]            (api)      / ["127.0.0.1:8080:8080"] (imgproxy)
#   extra_hosts: ["host.docker.internal:host-gateway"]
# and in .env set MYSETTINGS_DATABASE__HOST=host.docker.internal. MySQL must then listen on the
# docker bridge address (bind-address = 0.0.0.0 or the docker0 IP) and grant the application user
# from the bridge subnet ('radio_user'@'172.%'). Inside the api service use
#   MYSETTINGS_STORAGE__IMGPROXY__URL=http://imgproxy:8080
# with IMGPROXY_BIND=":8080".
