# FastAPI + SQLAlchemy Application Configuration

app_name = "My FastAPI App"
version = "1.0.0"
description = "A modern FastAPI application with SQLAlchemy"
environment = "development"

# Feature flags
enable_metrics = true
enable_tracing = false
enable_rate_limiting = true

[database]
driver = "postgresql+asyncpg"
host = "localhost"
port = 5432
name = "fastapi_db"
username = "postgres"
password = "your_password_here"
pool_size = 10
max_overflow = 20
pool_timeout = 30.0
pool_recycle = 3600
echo = false
echo_pool = false

[server]
host = "0.0.0.0"
port = 60800
workers = 1
reload = true
debug = true
title = "My FastAPI App"
description = "API for my awesome application"
docs_url = "/docs"
redoc_url = "/redoc"
openapi_url = "/openapi.json"

#[security]
#secret_key = "your-super-secret-key-here-make-it-at-least-32-characters-long"
#algorithm = "HS256"
#access_token_expire_minutes = 30
#refresh_token_expire_days = 7

[cors]
allow_origins = ["http://localhost:3000", "http://localhost:8080"]
allow_credentials = true
allow_methods = ["*"]
allow_headers = ["*"]


[redis]
host = "localhost"
port = 6379
db = 0
# password = "your_redis_password_here"  # Uncomment and set if Redis requires auth
decode_responses = true
max_connections = 10
retry_on_timeout = true