# Example of invalid configuration that will show human-readable errors

app_name = "MyApp"
version = "1.0.0"

[database]
host = "localhost"
port = "invalid_port"  # Should be integer
# name is missing (required field)
username = ""  # Should have min_length=1
password = "mypassword"
timeout = -5  # Should be >= 0

[server]
host = "0.0.0.0"
port = 99999  # Should be <= 65535
debug = "yes"  # Should be boolean
workers = 0  # Should be >= 1

[logging]
level = "INFO"
format = "{time} | {level} | {message}"
file = "app.log"

# This invalid config would generate errors like:
#
# Configuration validation failed for 'config.toml':
#
#   1. Field: 'database.port'
#      Error: Input should be a valid integer, unable to parse string as an integer
#      Type: int_parsing
#      Value: invalid_port
#
#   2. Field: 'database.name'
#      Error: Field required
#      Type: missing
#      Value: Not provided
#
#   3. Field: 'database.username'
#      Error: String should have at least 1 character
#      Type: string_too_short
#      Value:
#
#   4. Field: 'database.timeout'
#      Error: Input should be greater than or equal to 0
#      Type: greater_than_equal
#      Value: -5
#
#   5. Field: 'server.port'
#      Error: Input should be less than or equal to 65535
#      Type: less_than_equal
#      Value: 99999
#
#   6. Field: 'server.debug'
#      Error: Input should be a valid boolean, unable to interpret input
#      Type: bool_parsing
#      Value: yes
#
#   7. Field: 'server.workers'
#      Error: Input should be greater than or equal to 1
#      Type: greater_than_equal
#      Value: 0