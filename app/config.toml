[app]
name = "Radio Monitoring System"
version = "1.0.0"
debug = true
environment = "development"

[database]
host = "localhost"
port = 3306
name = "radio_monitoring"
user = "root"
password = "pythops"
echo = false
pool_size = 20
max_overflow = 40

[security]
secret_key = "your-secret-key-change-this-in-production"  # Use MYSETTINGS_SECURITY__SECRET_KEY env var in production
algorithm = "HS256"
access_token_expire_minutes = 30
refresh_token_expire_days = 7
session_expire_hours = 8
#allowed_origins = ["https://localhost:60800"]
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000", "*"]
jwt_leeway_seconds = 10
online_threshold_seconds = 300
activity_touch_interval_seconds = 60

[server]
host = "127.0.0.1"
port = 60800
reload = false
workers = 1

[admin]
username = "admin"
username_alias = "System Administrator"
pki_certificate_cn = "admin@radiomonitoring.local"
pki_certificate_serial = "ABC123DEF456"
pki_certificate_fingerprint = "12:34:56:78:90:AB:CD:EF:12:34:56:78:90:AB:CD:EF:12:34:56:78"

[logging]
level = "INFO"
# file_path = "logs/radio_monitoring.log"  # Uncomment to enable file logging
enable_file_logging = false

[timezone]
# Universal timezone support - any IANA timezone name
# Examples: "UTC", "Europe/Kyiv", "America/New_York", "Asia/Tokyo", "Europe/London"
# System will fallback to UTC if timezone is not available
timezone = "Europe/Kyiv"  # Ukraine timezone with automatic winter/summer time handling

[storage]
# Media file storage configuration
upload_path = "uploads"  # Base directory for uploaded files
max_file_size_gb = 10  # Maximum file size in gigabytes

# Nginx offloading (upload, download, symlinks, thumbnails via X-Accel-Redirect)
# When true, enables all nginx-side file handling.
enable_nginx = false
nginx_upload_temp_path = "/var/www/nginx_uploads"  # Must match nginx client_body_temp_path
nginx_internal_uploads_prefix = "/protected_uploads"  # Must match nginx internal location
nginx_symlink_path = "/protected_media"  # Directory for nginx symlinks

# External thumbnail generation via systemd watcher
# When true, FastAPI will NOT spawn background thumbnail tasks.
# Thumbnails are generated by the media-watcher + thumbnailgen@ systemd services
# running in separate processes, preventing I/O blocking of FastAPI workers.
external_thumbnail_generation = true

[health]
# Health endpoint security configuration
allowed_hosts = ["127.0.0.1", "localhost", "::1", "*"]  # Hosts allowed to access health endpoint. Use "*" to allow all
rate_limit_requests = 10  # Maximum requests per window (1-1000)
rate_limit_window_seconds = 60  # Rate limit window in seconds (10-3600)
enable_rate_limit = true  # Enable rate limiting for health endpoint
enable_host_check = false  # Enable host restrictions for health endpoint (set to true in production)